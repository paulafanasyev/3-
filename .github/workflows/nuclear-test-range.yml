name: Nuclear test range checks

on:
  pull_request:
    branches: [feat/game-design]
    paths:
      - 'src/game/client/**'
      - 'src/game/data/**'
      - 'public/audio/nuclear/**'
      - 'THIRD_PARTY_NOTICES.md'
  push:
    branches: [feat/nuclear-explosion-effects]

jobs:
  game-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - name: Check nuclear client syntax
        run: |
          node --check src/game/client/nuclear-range.js
          node --check src/game/client/nuclearAudio.js
          node --check src/game/client/nuclearEffects.js
          node --check src/game/client/nuclearDamage.js
          node --check src/game/client/layers.js
      - run: npm run test:game
      - name: Bundle Cesium application
        run: npx vite build
      - name: Browser smoke test — city selection, effects, audio and reset
        run: node scripts/nuclear-range-browser-smoke.mjs
