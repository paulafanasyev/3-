name: Apply Russian UI fixes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Apply the translation map plus direct runtime UI replacements, then rebuild the catalog.
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Apply known missing Russian UI translations
        run: node apply-ru-ui-map-missing.mjs

      - name: Apply Russian UI map
        run: node apply-ru-ui-map.mjs

      - name: Apply direct runtime UI replacements
        run: node apply-ru-ui-direct.mjs

      - name: Rebuild translation catalog
        run: node build-translation-catalog.mjs

      # The word map above translates words, and UPPER_SNAKE identifiers contain
      # words: without this step the bot re-commits names like ROCKET_МИССИЯ_...,
      # which breaks every importer (measured on main 16.11, commit dc8309f).
      - name: Repair Latin identifiers damaged by the word map
        run: node scripts/repair-i18n-identifiers.mjs

      - name: Commit applied translations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src localization
          if git diff --cached --quiet; then
            echo 'No Russian UI changes to commit.'
            exit 0
          fi
          git commit -m 'i18n: apply remaining Russian UI translations'
          git push
